name: Validate production readiness

on:
  push:
    branches:
      - development
      - main
      - production
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main, development, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1


      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint --max-warnings=0

      - name: Unit tests
        run: pnpm run test:ci

      - name: Production build
        run: pnpm run build
        env:
          VITE_SUPABASE_PROJECT_ID: bxuhcbfdoaflsgbxiqei
          VITE_SUPABASE_URL: https://bxuhcbfdoaflsgbxiqei.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
          VITE_REDIRECT_URI: https://alazab.com/auth/callback
          VITE_API_URL: https://alazab.com/api
          VITE_FACEBOOK_REDIRECT_URI: https://alazab.com/auth/callback/facebook

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Install backend dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then pnpm import; fi
          pnpm install --frozen-lockfile

      - name: Publish migrated backend lockfile for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-pnpm-lock
          path: server/pnpm-lock.yaml
          if-no-files-found: error

      - name: Syntax check
        run: pnpm run check

      - name: Lint backend
        run: pnpm run lint --max-warnings=0
