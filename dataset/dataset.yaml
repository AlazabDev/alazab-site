            افحص المنتج التالي:
            product_id: P-4001
            product_code: PLUM-001
            name: "سباكة حمامات"
            description: "توريد وتركيب سباكة الحمامات"
            family: "أعمال سباكة"
            category: "تركيبات حمامات"
            subcategory: "سباكة"
            unit: "نقطة"
            price: 350.00
            ProductImageS3: []
            ProductMasterImage:
              file_full_path: "https://cdn.al-azab.com/temp/plumbing.jpg?X-Amz-Signature=abc123"
        expected:
          status: "needs_review"
          image_status: "invalid_links"
          problems:
            - "الرابط يحتوي على X-Amz (Signed URL) - لا يعتمد كمرجع دائم"
            - "لا توجد صور ثابتة في ProductImageS3"
          decision: "يحتاج صورة ثابتة"

  - id: TC-PROD-005
    name: "فحص منتج - تصنيف غير مكتمل"
    description: |
      منتج بتصنيف واحد طويل يحتاج إلى تقسيم إلى family/category/subcategory.
    category: single_product_inspection
    priority: medium
    turns:
      - query:
          from: "محلل بيانات"
          message: |
            افحص المنتج التالي:
            product_id: P-5001
            product_code: PAINT-001
            name: "دهان داخلي"
            description: "دهان داخلي للجدران"
            classification: "أعمال دهانات داخلية وخارجية"
            unit: "متر مسطح"
            price: 45.00
            ProductImageS3:
              - file_full_path: "https://cdn.al-azab.com/images/P-5001/paint.jpg"
        expected:
          status: "ready"
          classification_suggested:
            family: "أعمال دهانات"
            category: "دهانات داخلية"
            subcategory: "دهان جدران"
          decision: "جاهز مع تعديل التصنيف"

