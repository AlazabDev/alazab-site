name: Receipts review build

on:
  push:
    branches: [main, production]
    paths:
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'src/components/receipts/**'
      - 'src/pages/ReceiptsPage.tsx'
      - 'supabase/migrations/**'
      - '.github/workflows/receipts-review-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run build
