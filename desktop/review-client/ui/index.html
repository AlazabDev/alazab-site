<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alazab Review</title>
  <style>
    :root { font-family: "Segoe UI", Tahoma, Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #101a52 0, #030957 38%, #02051f 100%);
      color: #fff;
      padding: 32px;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      padding: 42px;
      text-align: center;
      backdrop-filter: blur(18px);
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #ffb900;
      color: #030957;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 18px 45px rgba(255,185,0,.25);
    }
    h1 { margin: 0; font-size: 30px; }
    p { margin: 14px 0 0; color: #cbd5e1; line-height: 1.9; }
    .status {
      margin-top: 26px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      padding: 15px 18px;
      color: #f8fafc;
      font-size: 14px;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-left: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 18px rgba(34,197,94,.7);
    }
    small { display:block; margin-top: 20px; color:#64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">A</div>
    <h1>Alazab Review</h1>
    <p>التطبيق جاهز لاستقبال روابط المشاركة الآمنة الخاصة بالمراجعة.</p>
    <div class="status"><span class="dot"></span>في انتظار رابط من نوع <strong>alazab://</strong></div>
    <small>لا يلزم متصفح أو كلمة مرور.</small>
  </main>
</body>
</html>
