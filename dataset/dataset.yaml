            - "وصف غير كافٍ"
            - "لا يوجد تصنيف فرعي"
            - "لا توجد صور للمنتج"
          decision: "يحتاج صورة ومراجعة اسم"

  - id: TC-PROD-003
    name: "فحص منتج - وحدة غير منضبطة"
    description: |
      منتج بوحدة قياس غير قابلة للتسعير تحتاج إلى تصحيح.
    category: single_product_inspection
    priority: medium
    turns:
      - query:
          from: "محلل بيانات"
          message: |
            افحص المنتج التالي:
            product_id: P-3001
            product_code: CARP-001
            name: "تركيب مطبخ"
            description: "تركيب مطبخ خشبي"
            family: "وحدات خشبية"
            category: "وحدات مطابخ"
            subcategory: "مطابخ خشبية"
            unit: "عملية"
            price: 15000.00
            ProductImageS3:
              - file_full_path: "https://cdn.al-azab.com/images/P-3001/kitchen.jpg"
        expected:
