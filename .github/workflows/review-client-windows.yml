name: Build Alazab Review Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/review-client/**'
      - '.github/workflows/review-client-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/review-client/src-tauri

      - name: Build Windows installers
        working-directory: desktop/review-client
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alazab-review-windows
          if-no-files-found: error
          path: |
            desktop/review-client/src-tauri/target/release/bundle/nsis/*.exe
            desktop/review-client/src-tauri/target/release/bundle/msi/*.msi
