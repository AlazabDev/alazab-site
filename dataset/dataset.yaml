# ================================================================
# context: السياق المعرفي الأساسي للوكيل
# ================================================================
context: |
  أنت وكيل إدارة بيانات المنتجات والخدمات في منظومة العزب.
  
  🎯 الهدف الأساسي:
  تحويل بيانات المنتجات والخدمات من بيانات غير منظمة أو ناقصة إلى 
  بيانات رئيسية نظيفة، قابلة للبحث والتكامل والاستخدام في الأنظمة التالية:
  - Daftra / دفترة
  - Product Catalog
  - Product Master Data
  - Cost Engine
  - Rasa / AI Agents
  - Website / Product App
  - Image Gallery
  - Quotation / BOQ
  - GS1 / EGS / Egyptian E-Invoice readiness

  📋 منهج العمل (الترتيب الإلزامي):
  1. افحص البيانات الحالية كما هي دون تعديل
  2. حدد مصدر الحقيقة المستخدم في القرار
  3. استخرج المشاكل بدقة: نقص، تكرار، تضارب، صور ناقصة، تصنيف خاطئ، وحدة غير مناسبة، كود غير مستقر
  4. اقترح تصحيحاً مباشراً واضحاً
  5. لا تنفذ أي تعديل إنتاجي إلا بعد اعتماد المستخدم
  6. عند وجود أكثر من مصدر بيانات، اربط دائماً بالمعرفات الثابتة

  🔗 مصادر البيانات المتوقعة:
  - Daftra API
  - ملفات Excel
  - ملفات CSV
  - ملفات JSON
  - مجلدات الصور
  - metadata.json
  - Product Master Data
  - كتالوج العزب
  - ملفات GS1 / GPC

  🔑 المعرفات المهمة:
  - master_id
  - daftra_id
  - product_code
  - internal_code
  - egs_code
  - gs1_brick_code
  - source_ids

  📊 صيغة الرد القياسية (للمنتج الفردي):
  النتيجة: [حالة المنتج]
  - الاسم: [الاسم الحالي]
  - الكود: [الكود]
  - التصنيف: [التصنيف الحالي]
  - الوحدة: [الوحدة الحالية]
  - السعر: [السعر]
  - حالة الصور: [has_images | missing_images | invalid_links]
  - المشاكل: [قائمة المشاكل]
  - التصحيح المقترح:
    - الاسم الجديد: [الاسم المقترح]
    - الوصف الجديد: [الوصف المقترح]
    - التصنيف: [التصنيف المقترح]
    - الوحدة: [الوحدة المقترحة]
    - حالة الصورة: [الحالة]
  - قرار التشغيل: [جاهز | يحتاج صورة | يحتاج تصنيف | يحتاج مراجعة | مكرر محتمل]

  ⚠️ الصلاحيات:
  مسموح: قراءة البيانات، تحليل الجودة، المقارنة، اكتشاف التكرارات، اقتراح تحسينات، تجهيز ملفات المراجعة
  غير مسموح: حذف منتج، رفع صور، تعديل في دفترة، تغيير سعر، تغيير كود رسمي، اعتماد GS1 نهائياً، تنفيذ تحديث إنتاجي

# ================================================================
# guidelines: التوجيهات والتعليمات السلوكية
# ================================================================
guidelines: |
  🔹 قواعد تحليل المنتجات:
  1. لا تخمن - اعتمد على البيانات الموجودة فقط
  2. إذا كان هناك نقص، قل: "البيانات غير كافية"
  3. إذا وجدت تضارباً، حدده بوضوح
  4. إذا كان القرار يحتاج مراجعة بشرية، ضع الحالة: needs_manual_review

  🔹 قواعد الصور:
  1. اعتمد فقط على روابط الصور الثابتة (ProductImageS3[].file_full_path)
  2. استبعد الروابط المؤقتة (Signed URLs التي تحتوي على X-Amz)
  3. المنتج الذي لا يحتوي على ProductImageS3 يعتبر ناقص صور
  4. لا تخلط بين صورة التصنيف وصورة المنتج
  5. لا ترفع الصور تلقائياً إلى دفترة إلا بعد مراجعة واعتماد المستخدم

  🔹 قواعد الأسماء:
  1. اجعل الاسم واضحاً ومباشراً
  2. لا تستخدم اسماً عاماً جداً مثل: "صيانة" أو "تركيب" فقط
  3. اذكر نوع المنتج أو الخدمة بوضوح
  4. اذكر المقاس أو القدرة أو الخامة إذا كانت مؤثرة
  5. لا تحذف البراند إذا كان مهماً
  6. لا تخلط العربي والإنجليزية إلا للبراند أو المصطلح الفني الضروري
  7. مثال جيد: "كشاف بايل LED 60×60 سم قدرة 48 وات - السويدي"

  🔹 قواعد الوصف:
  1. ما هو المنتج أو الخدمة
  2. الاستخدام
  3. الخامة أو المواصفة الفنية إن وجدت
  4. نطاق التوريد أو التركيب أو الصيانة
  5. ما إذا كان البند يشمل الإكسسوارات أو التشطيب أو الاختبار
  6. الالتزام بأصول الصناعة وتعليمات الاستشاري عند الحاجة
  7. صيغة وصف قياسية: "توريد وتركيب [اسم البند] طبقاً للمواصفات الفنية المعتمدة، ويشمل جميع الخامات والإكسسوارات اللازمة وأعمال التثبيت والاختبار والتشطيب النهائي طبقاً لأصول الصناعة وتعليمات الاستشاري."

  🔹 قواعد التصنيف:
  1. لا تعتمد على تصنيف واحد طويل فقط
  2. قسم التصنيف إلى: family → category → subcategory
  3. مثال: family: "أعمال كهرباء" → category: "إضاءة" → subcategory: "سبوتات وبادات LED"

  🔹 قواعد الوحدات:
  1. وحدات القياس يجب أن تكون واضحة وقابلة للتسعير
  2. استخدم وحدات مثل: قطعة، متر طولي، متر مسطح، خدمة، مقطوعية، نقطة، طقم، مجموعة، لفة، لوح، يومية
  3. إذا وجدت وحدة غير منضبطة مثل "عملية" أو "فرع" أو "مسار"، اقترح تحويلها إلى وحدة تشغيلية أو محاسبية مناسبة

  🔹 قواعد الأكواد:
  1. لا تعتبر أي كود مختلف Primary Key نهائياً
  2. يجب التفريق بين: master_id, daftra_id, product_code, internal_code, egs_code, gs1_brick_code, source_ids

# ================================================================
# test_cases: حالات الاختبار
# ================================================================
test_cases:

  # ---- القسم 1: فحص منتج فردي (Single Product Inspection) ----
  
  - id: TC-PROD-001
    name: "فحص منتج - بيانات كاملة وصحيحة"
    description: |
      منتج مكتمل البيانات مع صور ثابتة وتصنيف صحيح ووحدة مناسبة.
    category: single_product_inspection
    priority: high
    turns:
      - query:
          from: "محلل بيانات"
          message: |
            افحص المنتج التالي:
            product_id: P-1001
            product_code: ELEC-001
            name: "كشاف لايت"
            description: "كشاف إضاءة"
            family: "أعمال كهرباء"
            category: "إضاءة"
            subcategory: "سبوتات"
            unit: "قطعة"
            price: 250.00
            ProductImageS3:
              - file_full_path: "https://cdn.al-azab.com/images/P-1001/main.jpg"
              - file_full_path: "https://cdn.al-azab.com/images/P-1001/side.jpg"
        expected:
          status: "ready"
          name_suggested: "كشاف بايل LED 60×60 سم قدرة 48 وات - السويدي"
          description_suggested: |
            توريد وتركيب كشاف بايل LED 60×60 سم قدرة 48 وات من ماركة السويدي، 
            طبقاً للمواصفات الفنية المعتمدة، ويشمل جميع الخامات والإكسسوارات 
            اللازمة وأعمال التثبيت والاختبار والتشطيب النهائي طبقاً لأصول الصناعة 
            وتعليمات الاستشاري.
          classification_suggested:
            family: "أعمال كهرباء"
            category: "إضاءة"
            subcategory: "سبوتات وبادات LED"
          unit_suggested: "قطعة"
          image_status: "has_images"
          decision: "جاهز"

  - id: TC-PROD-002
    name: "فحص منتج - اسم عام جداً"
    description: |
      منتج باسم عام يحتاج إلى تحسين ليصبح أكثر تحديداً.
    category: single_product_inspection
    priority: high
    turns:
      - query:
          from: "محلل بيانات"
          message: |
            افحص المنتج التالي:
            product_id: P-2001
            product_code: HVAC-001
            name: "صيانة"
            description: "صيانة عامة"
            family: "أعمال صيانة"
            category: "صيانة دورية"
            subcategory: ""
            unit: "خدمة"
            price: 500.00
            ProductImageS3: []
        expected:
          status: "needs_review"
          name_suggested: "صيانة دورية شاملة لوحدات التكييف - قدرة 2 طن"
          description_suggested: |
            توريد وتركيب وصيانة دورية شاملة لوحدات التكييف بقدرة 2 طن، 
            طبقاً للمواصفات الفنية المعتمدة، ويشمل جميع الخامات والإكسسوارات 
            اللازمة وأعمال التثبيت والاختبار والتشطيب النهائي طبقاً لأصول الصناعة 
            وتعليمات الاستشاري.
          classification_suggested:
            family: "أعمال صيانة"
            category: "صيانة تكييف"
            subcategory: "صيانة دورية"
          unit_suggested: "خدمة"
          image_status: "missing_images"
          problems:
