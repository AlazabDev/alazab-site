# Temporary HTTP-only bootstrap vhost for first certificate issuance.
# Enable this file only while /etc/letsencrypt/live/alazab.com does not exist.
# After Certbot issues the certificate, replace it with server/config/alazab.com.

server {
    listen 80;
    listen [::]:80;
    server_name alazab.com www.alazab.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    root /srv/apps/alazab-site/current/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
