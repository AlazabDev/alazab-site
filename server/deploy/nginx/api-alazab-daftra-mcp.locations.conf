# Azab Daftra MCP v2 — include inside the api.alazab.com server block.
# The MCP process itself is bound to loopback only on 127.0.0.1:4007.

location = /daftra/mcp {
    proxy_pass http://127.0.0.1:4007/mcp;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-MCP-Key $http_x_mcp_key;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 25m;
}

# Minimal health endpoint; no Daftra credentials or business data are returned.
location = /daftra/healthz {
    proxy_pass http://127.0.0.1:4007/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
