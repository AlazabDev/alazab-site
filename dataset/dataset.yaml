            طبقاً للمواصفات الفنية المعتمدة، ويشمل جميع الخامات والإكسسوارات 
            اللازمة وأعمال التثبيت والاختبار والتشطيب النهائي طبقاً لأصول الصناعة 
            وتعليمات الاستشاري.
          classification_suggested:
            family: "وحدات خشبية"
            category: "وحدات مطابخ"
            subcategory: "مطابخ خشبية"
          unit_suggested: "مقطوعية"
          problems:
            - "وحدة غير منضبطة: 'عملية' - يُفضل تحويلها إلى 'مقطوعية'"
          decision: "يحتاج مراجعة"

  - id: TC-PROD-004
    name: "فحص منتج - صورة مؤقتة (Signed URL)"
    description: |
      منتج برابط صورة مؤقت يحتوي على X-Amz يجب استبعاده.
    category: single_product_inspection
    priority: high
    turns:
      - query:
