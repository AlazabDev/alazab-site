name: Validate React application

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PN module
        run: >-
          pnpm exec eslint
          src/pages/PNPage.tsx
          src/lib/pn.ts
          src/pages/NotFound.tsx
          --report-unused-disable-directives
          --max-warnings 0
          --rule 'react-hooks/set-state-in-effect: off'

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build
