<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز أدوات دفترة | Alazab</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#14223f;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#030957;color:#fff;padding:34px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0 0 8px}header p{margin:0;color:#dbe5ff}main{max-width:1100px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #dce2ec;border-radius:14px;padding:22px}.card h2{font-size:18px;margin:0 0 9px}.card p{line-height:1.7;color:#475569;margin:0 0 16px}.pill{font-size:12px;padding:4px 10px;border-radius:20px;background:#e2e8f0}.ready{background:#dcfce7;color:#166534}.link{display:inline-block;background:#ffb900;padding:9px 15px;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.muted{color:#64748b}#error{padding:16px;background:#fff7ed;border:1px solid #fdba74;border-radius:8px}a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
</style></head><body><header><h1>مركز تطوير دفترة</h1><p>ALAZAB CONSTRUCTION · مركز الأدوات والبيانات</p></header><main><p class="muted">التطبيقات الجاهزة متاحة مباشرة. الوحدات المخطط لها لا تعرض روابط غير منفذة.</p><div id="error" role="alert" hidden></div><section id="grid" class="grid" aria-label="وحدات النظام"></section></main><script>
'use strict';const grid=document.getElementById('grid'),error=document.getElementById('error');
async function load(){try{const r=await fetch('./config/modules.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.modules))throw Error('بنية قائمة الوحدات غير صحيحة');for(const m of d.modules){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='meta';const h=document.createElement('h2');h.textContent=m.name;const st=document.createElement('span');st.className='pill'+(m.status==='ready'?' ready':'');st.textContent=m.status==='ready'?'متاح':'مخطط';head.append(h,st);const p=document.createElement('p');p.textContent=m.description||'';card.append(head,p);if(m.status==='ready'&&typeof m.entry==='string'&&/^\.\/[a-zA-Z0-9_./-]+\.html$/.test(m.entry)){const a=document.createElement('a');a.className='link';a.href=m.entry;a.textContent='فتح الأداة';card.append(a)}grid.append(card)}}catch(e){error.hidden=false;error.textContent='تعذّر قراءة config/modules.json: '+e.message}}
load();
</script></body></html>
