# Include inside the existing api.alazab.com TLS server block.
location = /knowledge/mcp {
    proxy_pass http://127.0.0.1:4018/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 256k;
}
location = /.well-known/oauth-protected-resource/knowledge/mcp {
    proxy_pass http://127.0.0.1:4018/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
}
location = /knowledge/health {
    proxy_pass http://127.0.0.1:4018/health;
    proxy_set_header Host $host;
    access_log off;
}
