name: Validate OpenAI MCP

on:
  push:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/openai/**'
      - 'server/mcp/knowledge/**'
      - 'server/deploy/nginx/api-alazab-knowledge-mcp.locations.conf'
      - 'server/ecosystem.config.js'
      - 'server/deploy/nginx/api-alazab-openai-mcp.locations.conf'
      - '.github/workflows/validate-openai-mcp.yml'
  pull_request:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/openai/**'
      - 'server/mcp/knowledge/**'
      - 'server/deploy/nginx/api-alazab-knowledge-mcp.locations.conf'
      - 'server/ecosystem.config.js'
      - 'server/deploy/nginx/api-alazab-openai-mcp.locations.conf'
      - '.github/workflows/validate-openai-mcp.yml'
  workflow_dispatch:

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Install server dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then pnpm import; fi
          pnpm install --frozen-lockfile

      - name: Syntax check
        run: |
          node --check mcp/openai/server.js
          node --check mcp/openai/smoke-test.js

      - name: MCP protocol smoke test
        run: node mcp/openai/smoke-test.js

      - name: Knowledge filesystem regression tests
        run: pnpm run mcp:knowledge:test
