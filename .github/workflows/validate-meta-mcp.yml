name: Validate Meta MCP
on:
  push:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/meta/**'
      - 'server/package.json'
      - 'server/.env.production.example'
      - '.github/workflows/validate-meta-mcp.yml'
  pull_request:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/meta/**'
      - 'server/package.json'
      - '.github/workflows/validate-meta-mcp.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js
      - run: |
          if [ ! -f pnpm-lock.yaml ]; then pnpm import; fi
          pnpm install --frozen-lockfile
      - run: pnpm run mcp:meta:check
      - run: node --test mcp/meta/test/smoke.mjs
