name: Alazab JavaScript toolchain
description: Install the repository-pinned Node.js and pnpm versions.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        package_json_file: package.json
        run_install: false
    - name: Verify toolchain
      shell: bash
      run: |
        node -e "const fs=require('node:fs'); const assert=require('node:assert/strict'); assert.equal(process.versions.node, fs.readFileSync('.node-version','utf8').trim())"
        test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
