# Included from the existing HTTPS server block for alazab.com.
# Does not replace the existing /meta/ API location.
location = /meta/mcp {
    proxy_pass http://127.0.0.1:8187/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location = /meta/health {
    proxy_pass http://127.0.0.1:8187/health;
    proxy_set_header Host $host;
}

# OAuth discovery and authorization for ChatGPT.
location = /.well-known/oauth-protected-resource/meta/mcp {
    proxy_pass http://127.0.0.1:8187/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
}
location = /.well-known/oauth-authorization-server/meta {
    proxy_pass http://127.0.0.1:8187/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
}
location = /meta/.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8187/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
}
location = /meta/.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8187/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
}
location ^~ /meta/oauth/ {
    proxy_pass http://127.0.0.1:8187/oauth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    client_max_body_size 32k;
}
