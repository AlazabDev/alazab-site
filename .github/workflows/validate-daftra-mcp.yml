name: Validate Daftra MCP

on:
  push:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/daftra/**'
      - 'public/az/api/daftra.openapi.json'
      - 'server/ecosystem.config.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/deploy/nginx/api-alazab-daftra-mcp.locations.conf'
      - '.github/workflows/validate-daftra-mcp.yml'
  pull_request:
    paths:
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/package-lock.json'
      - 'server/package.json'
      - '.github/actions/setup-js/**'
      - '.node-version'
      - 'package.json'
      - 'server/mcp/daftra/**'
      - 'public/az/api/daftra.openapi.json'
      - 'server/ecosystem.config.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/deploy/nginx/api-alazab-daftra-mcp.locations.conf'
      - '.github/workflows/validate-daftra-mcp.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup shared JavaScript toolchain
        uses: ./.github/actions/setup-js

      - name: Install backend dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then pnpm import; fi
          pnpm install --frozen-lockfile

      - name: Validate pinned source contract
        run: pnpm run mcp:daftra:catalog

      - name: Syntax check Daftra MCP
        run: find mcp/daftra -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Registry and Arabic intent smoke test
        env:
          DAFTRA_OPENAPI_STRICT_HASH: 'true'
        run: pnpm run mcp:daftra:smoke

      - name: HTTP MCP smoke test
        run: pnpm run mcp:daftra:http-test
