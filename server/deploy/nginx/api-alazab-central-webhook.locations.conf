# Include inside the HTTPS server block for api.alazab.com.
# Public URL prefix: https://api.alazab.com/events/
# Internal listener: 127.0.0.1:4010

location = /events {
    return 308 /events/;
}

location /events/ {
    proxy_pass http://127.0.0.1:4010/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Preserve provider signature headers.
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_set_header X-GitHub-Event $http_x_github_event;
    proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    proxy_set_header X-Azab-Timestamp $http_x_azab_timestamp;
    proxy_set_header X-Azab-Signature $http_x_azab_signature;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering on;

    client_max_body_size 10m;
}
