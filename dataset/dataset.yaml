# الغرض: تقييم أداء الوكيل في تحليل وتنظيم بيانات المنتجات والخدمات
# المصدر: محتوى تدريب الوكلاء.pdf (مواصفة إعدادات الوكيل)
# الإصدار: 1.0
# تاريخ الإنشاء: 2026-06-30
# ================================================================

name: AZ-PRODUCT-DATASET
version: "1.0"
description: |
  مجموعة اختبارات شاملة لوكيل إدارة بيانات المنتجات والخدمات.
  تغطي السيناريوهات التالية: فحص منتج فردي، فحص مجموعة منتجات،
  تحليل الصور، تصحيح الأسماء والأوصاف، التصنيف، الوحدات، الأكواد،
  والتعامل مع مصادر بيانات متعددة (دفترة، Excel، CSV، JSON).
language: ar-SA
domain: product_management
target_agent: az-agent-product-catalog

