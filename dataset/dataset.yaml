          message: |
            افحص مجموعة المنتجات التالية وأعد تقريراً ملخصاً:
            [قائمة 10 منتجات من دفترة]
            - P-1001: مكتمل
            - P-1002: اسم عام
            - P-1003: بدون صور
            - P-1004: تصنيف خاطئ
            - P-1005: مكرر محتمل مع P-1001
            - P-1006: وحدة غير منضبطة
            - P-1007: مكتمل
            - P-1008: وصف ناقص
            - P-1009: كود غير مستقر
            - P-1010: يحتاج مراجعة بشرية
        expected:
