# Include these locations inside the existing `server {}` block for api.alazab.com.
# The legacy Alazab MCP gateway remains on 127.0.0.1:4005; only the public
# standards endpoint /mcp is routed to the OpenAI-compatible sidecar on :4015.

location = /mcp {
    proxy_pass http://127.0.0.1:4015/mcp;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:4015/.well-known/oauth-protected-resource;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
